spring.application.name=canditature
server.port=8085

# --- Eureka ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# Dans Docker, le nom de conteneur n'est pas joignable : on inscrit l'adresse IP
eureka.instance.prefer-ip-address=true

# --- MySQL (base propre au microservice) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/candidature_db3?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Afficher le champ "message" des erreurs (ResponseStatusException)
server.error.include-message=always

# --- OpenFeign (chapitre 4) ---
spring.cloud.openfeign.client.config.default.logger-level=basic
logging.level.esprit.canditature.feignClient=DEBUG

# --- RabbitMQ  ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:awd}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:awd}
# RabbitMQ arrêté : échouer vite plutôt que bloquer le POST pendant 60 s
spring.rabbitmq.connection-timeout=2s
# Publisher confirms : le broker confirme la réception de chaque message
spring.rabbitmq.publisher-confirm-type=correlated
# Publisher returns + mandatory : être prévenu si aucune queue ne reçoit le message
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
logging.level.esprit.canditature.messaging=DEBUG
